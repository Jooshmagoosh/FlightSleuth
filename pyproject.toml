[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightsleuth"
version = "0.1.0"
description = "Find the cheapest fares for a route by scanning dates, trip lengths and airports."
readme = "README.md"
requires-python = ">=3.11"
# The core runs on the standard library alone. Optional parts get their own extras when they arrive.
dependencies = []

[project.scripts]
flightsleuth = "flightsleuth.cli:main"

[tool.setuptools.packages.find]
include = ["flightsleuth*"]

[tool.setuptools.package-data]
# links.json: the address patterns for other sites.
flightsleuth = ["*.json"]
